[general]
live_config_reload = true
# relativ zu dieser Datei; Farben von Matugen, Schriften von fontgen
# (vorher "~./colors/…" – der Pfad existierte nicht, die Matugen-Farben wurden nie geladen)
import = ["colors/matugen.toml", "fonts.toml"]

# Schriftfamilie/-größe: fonts.toml (fontgen). Hier nur der Feinschliff:

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 0

[scrolling]
history = 10000
multiplier = 3

[window]
opacity = 0.9
dynamic_title = true
decorations = "none"

[window.padding]
x = 18
y = 20

[cursor]
blink_interval = 450
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Beam"

# Farben kommen komplett aus colors/matugen.toml (Matugen). Feste Werte hier würden
# den Import überschreiben – die Hauptdatei hat Vorrang.

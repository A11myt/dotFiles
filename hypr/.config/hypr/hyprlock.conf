source = ~/.config/hypr/themes/matugen.conf
source = ~/.config/hypr/themes/fonts.conf   # fontgen: $font, $font_ui, $font_accent


general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = $inverse_on_surface
    # inner_color = rgba(15,15,15,0.9) # Hintergrund wie Alacritty background, mit Opazität
    outer_color = $primary $tertiary 120deg   # Matugen-Akzent
    check_color = $on_surface $primary 120deg  # während der Prüfung
    fail_color = $error $error_container 20deg # falsches Passwort
    font_color = $on_surface
    
    fade_on_empty = false
    rounding = 100

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.2

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -380
    halign = center
    valign = center
}

# TIME (Hours)
label {
    monitor =
    text = cmd[update:60000] date +"%H" # update every 60 seconds
    font_size = 150
    font_family = $font
    # font_family = $font
    position = 0, -330
    halign = center
    valign = top
    color = $primary
}

# TIME (Minutes) 
label {
    monitor =
    text = cmd[update:60000] date +"%M" # update every 60 seconds
    font_size = 150
    font_family = $font
    # font_family = $font
    position = 0, -500
    halign = center
    valign = top
}


# DATE
label {
    monitor =
 
    # Punkt ist Teil des Textes (Pango-Markup) -> sitzt immer direkt vor dem Monat, egal wie lang Wochentag/Monat sind.
    # Farbe = Matugen-Akzent, liest das Skript aus themes/matugen.conf
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-date.sh
    font_size = 25
    # font_family = Iosevka Nerd Font Mono
    color = $on_surface
    shadow_passes = 1   # hyprlock kennt kein shadow/shadow_offset
    shadow_size = 3
    shadow_color = rgba(0,0,0,0.35)
    position = -30, -1020
    halign = right
    valign = top
}

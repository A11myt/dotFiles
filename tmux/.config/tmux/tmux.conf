##### GENERAL ###############################################################
# Einzige tmux-Config (vorher zusätzlich ~/.tmux.conf, am 2026-10-08 hier zusammengeführt)

set -g  base-index 1
setw -g pane-base-index 1
set -g  mouse on
set -g  default-terminal "tmux-256color"
set -g  escape-time 10
set -g  repeat-time 0              # Pfeiltasten direkt nach Fensterwechsel nutzbar
set -g  allow-rename off           # Fensternamen nicht automatisch überschreiben
setw -g monitor-activity on
set -g  visual-activity off
setw -g display-panes-time 1500
setw -g other-pane-height 25
setw -g other-pane-width 80

source ~/.config/tmux/utility.conf

##### COLORS / ACCENT #######################################################

# Fallback, falls Matugen noch nie lief – colors.conf überschreibt das
set -g @accent       "#ff6a00"
set -g @fg_default   "#dcdfe4"
set -g @fg_dim       "#a9a9a9"
set -g @fg_muted     "#666666"
set -g @fg_active    "#ffffff"
set -g @bg_status    "#0f0f0f"
set -g @border       "#444444"
source-file -q ~/.config/tmux/colors.conf   # von Matugen generiert

# Truecolor (Alacritty meldet TERM=alacritty)
set -as terminal-features ",alacritty*:RGB,xterm-256color:RGB"

##### STATUSBAR – ULTRA MINIMAL #############################################

set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify centre
# set -g status-keys emacs

# flach, keine extra Balkenfarbe außer leichtem dunklen Hintergrund
set -g status-style "bg=#{@bg_status},fg=#{@fg_default}"

# Status-Limits eher klein, um es kompakt zu halten
set -g status-left-length 30
set -g status-right-length 80

##### LEFT – ARCH / SESSION #################################################

# • in Akzentfarbe (NDOT, weil bold) + Sessionname in normal
set -g status-left '#[bold,fg=#{@accent}]• #[nobold,fg=#{@fg_default}]#S '

##### RIGHT – NOTHING WIDGET ################################################

# Rechts: Ring + (bold = NDOT) + Datum + User
set -g status-right '\
#[fg=#{@fg_muted}]◦ \
#[nobold,fg=#{@accent}]%Y-%m-%d \
#[fg=#{@fg_muted}]▢ #(whoami) \
'

##### WINDOWS – CLEAN, AIRY #################################################

# Inaktive Fenster: leise, grau, kein Hintergrund
set-window-option -g window-status-format ' #[fg=#{@fg_muted}]#I #[fg=#{@fg_dim}]#W '

# Aktives Fenster: Bold (-> NDOT), Akzent-Punkt + heller Text
set-window-option -g window-status-current-format ' #[bold,fg=#{@accent}]• #[fg=#{@fg_active}]#W #[nobold]'

# Keine extra Hintergründe für Fenster, nur Textfarben
set -g window-style 'fg=#{@fg_dim},bg=default'
set -g window-active-style 'fg=#{@fg_active},bg=default'

##### MISC / BEHAVIOUR ######################################################

set -g history-limit 50000

##### PANE BORDER WITH DOTMATRIX FONT (via BOLD) ###########################

# Pane border aktivieren
set -g pane-border-status top

set -g pane-border-style "fg=#{@border}"
set -g pane-active-border-style "fg=#{@border}"

##### Text oben wird Dot-Matrix + rot/orange
set -g pane-border-format " #[bold]#[fg=#{@accent}]#{pane_host}#{b:pane_current_path}#[nobold] "

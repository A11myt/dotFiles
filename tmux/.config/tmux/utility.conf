##### BASICS (aus altem ~/.tmux.conf übernommen) ##############################

bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind r refresh-client
bind L clear-history

# Fenster
bind c      new-window -c "#{pane_current_path}"
bind Space  next-window
bind BSpace previous-window
bind t      next-window
bind T      previous-window
bind Enter  next-layout
bind +      select-layout main-horizontal
bind =      select-layout main-vertical
bind C-o    rotate-window

# Panes
bind s split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind a last-pane
bind -n C-S-Up    resize-pane -U 5
bind -n C-S-Down  resize-pane -D 5
bind -n C-S-Left  resize-pane -L 5
bind -n C-S-Right resize-pane -R 5

##### COPY MODE (vi-style) ###################################################

set-window-option -g mode-keys vi

# Enter copy mode with prefix + [  (tmux default, kept)
# Easier: prefix + v
bind v copy-mode

# In copy mode: v = start selection, V = line selection, y = yank, q = quit
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi Enter  send-keys -X copy-pipe-and-cancel 'wl-copy'

##### PANE NAVIGATION (vim-tmux-navigator) ###################################

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Split panes
bind \\ split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'

# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E lazygit

# Run Claude Code in a separate session


# bind -r y run-shell '\
#   SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
#   tmux has-session -t "$SESSION" 2>/dev/null || \
#   tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude --continue"; \
#   tmux switch-client -t "$SESSION"'

bind -r y run-shell "ROOT=\$(cd \"#{pane_current_path}\" && git rev-parse --show-toplevel 2>/dev/null || echo \"#{pane_current_path}\"); \
  SESSION=\"claude-\$(echo \"\$ROOT\" | md5sum | cut -c1-8)\"; \
  if ! tmux has-session -t \"\$SESSION\" 2>/dev/null; then \
    tmux new-session -d -s \"\$SESSION\" -c \"\$ROOT\" 'claude --continue || claude'; \
  fi; \
  tmux display-popup -w 80% -h 80% -E \"tmux attach-session -t \$SESSION\""

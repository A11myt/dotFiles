# ThinkPad-Akkus schonen: nur bis 80 % laden, erst unter 75 % wieder anfangen.
# Wird bei jedem Boot von systemd-tmpfiles gesetzt (/etc/tmpfiles.d/).
# Einmalig voll laden (unterwegs):  akku voll   |  zurück:  akku schonen
w /sys/class/power_supply/BAT0/charge_control_end_threshold   - - - - 80
w /sys/class/power_supply/BAT0/charge_control_start_threshold - - - - 75
w /sys/class/power_supply/BAT1/charge_control_end_threshold   - - - - 80
w /sys/class/power_supply/BAT1/charge_control_start_threshold - - - - 75

[config]

[config.wallpaper]
command = '/home/jason/.config/matugen/wallpaper.sh {{ image }}'
set = true

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/colors/matugen.toml'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/themes/matugen.lua'
post_hook = 'hyprctl reload'


# hyprlock nutzt weiterhin die hyprlang-Variante
[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/themes/matugen.conf'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
# Portal neu starten → Datei-Auswahldialoge übernehmen die Farben.
# GTK4 liest gtk.css nur beim Start → Nautilus neu starten, offene Ordner und Fensterlage
# (Arbeitsfläche, schwebend, Position, Größe) werden gemerkt und wiederhergestellt
post_hook = 'gsettings set org.gnome.desktop.interface color-scheme prefer-{{mode}}; systemctl --user restart xdg-desktop-portal-gtk 2>/dev/null; python3 ~/.config/matugen/nautilus-restart.py; true'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'


[config]

[config.wallpaper]
command = '/home/jason/.config/matugen/wallpaper.sh {{ image }}'
set = true

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/colors/matugen.toml'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/themes/matugen.lua'
post_hook = 'hyprctl reload'


# hyprlock nutzt weiterhin die hyprlang-Variante
[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/themes/matugen.conf'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
# Portal neu starten → Datei-Auswahldialoge übernehmen die Farben.
# GTK4 liest gtk.css nur beim Start: Nautilus nur beenden, wenn er ohne Fenster im
# Hintergrund läuft – offene Fenster bleiben, neue Farben gibt es beim nächsten Öffnen
post_hook = 'gsettings set org.gnome.desktop.interface color-scheme prefer-{{mode}}; systemctl --user restart xdg-desktop-portal-gtk 2>/dev/null; if pgrep -x nautilus >/dev/null && ! hyprctl clients -j | jq -e "any(.[]; .class == \"org.gnome.Nautilus\")" >/dev/null; then nautilus -q; fi; true'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'
# post_hook = 'pkill -SIGUSR1 rofi'

[templates.wlogout]
input_path='~/.config/matugen/templates/colors.css'
output_path='~/.config/wlogout/styles/colors.css'

[templates.swaync]
input_path='~/.config/matugen/templates/colors.css'
output_path='~/.config/swaync/colors/colors.css'

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian.css'
output_path = '~/Obsidian/.obsidian/snippets/matugen.css'

[templates.steam]
input_path = '~/.config/matugen/templates/steam.css'
output_path = '~/.var/app/io.github.Foldex.AdwSteamGtk/config/AdwSteamGtk/custom.css'
post_hook = 'flatpak run io.github.Foldex.AdwSteamGtk -i'  # läuft per wallthemes.toml im Hintergrund

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim.lua'
output_path = '~/.config/nvim/lua/config/matugen_colors.lua'
post_hook = 'pkill -SIGUSR1 nvim; python3 ~/.config/matugen/godot-theme.py'

[templates.ags]
input_path = '~/.config/matugen/templates/ags-colors.scss'
output_path = '~/.config/ags/colors.scss'
# kein Hook: AGS beobachtet colors.scss und lädt das CSS live neu (app.ts)

[templates.regreet]
input_path = '~/.config/matugen/templates/regreet.css'
output_path = '/var/lib/greeter-theme/regreet.css'

[templates.tmux]
input_path = '~/.config/matugen/templates/tmux-colors.conf'
output_path = '~/.config/tmux/colors.conf'
post_hook = 'tmux source-file ~/.config/tmux/tmux.conf 2>/dev/null; true'

[templates.vscode]
input_path = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'
post_hook = 'python3 ~/.config/matugen/vscode-theme.py'

# Papirus-Ordnerfarbe → ~/.local/share/icons/Papirus-Matugen (ohne root)
[templates.folder-icons]
input_path = '~/.config/matugen/templates/folder-icons.txt'
output_path = '~/.cache/matugen/folder-icons.txt'
post_hook = 'python3 ~/.config/matugen/folder-icons.py'

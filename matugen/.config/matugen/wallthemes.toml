# wallthemes: welche post_hooks dürfen warten?
#
# Alle Dateien werden sofort geschrieben. Nur die Hooks (App neu laden/anwenden) werden
# aufgeteilt: Läuft eine der genannten Apps gerade → sofort. Sonst → still im Hintergrund,
# direkt nachdem die offenen Apps fertig sind, mit niedriger Priorität und entprellt
# (wählst du währenddessen ein neues Wallpaper, bricht der alte Lauf ab).
# Templates, die hier nicht stehen, laufen immer sofort.

delay = 0   # Sekunden Wartezeit vor dem Hintergrund-Lauf

[matugen]
# Farbschema: tonal-spot (gedämpft), vibrant (kräftig), fidelity, content, expressive …
scheme = "vibrant"
# Ausgangsfarbe: dominant = häufigste Farbe im Bild, value = hellste, saturation = gesättigtste
source = "value"
mode = "dark"

[defer]
# Template = Prozessnamen (wie in /proc/<pid>/comm), oder "always"
steam        = "always"            # Skin greift erst beim nächsten Steam-Start
pywalfox     = ["firefox"]
vscode       = ["code"]
tmux         = ["tmux: server"]
nvim         = ["nvim", "godot"]
folder-icons = ["nautilus"]

[auto]
enabled = true
lat = 49.66
lon = 9.0
